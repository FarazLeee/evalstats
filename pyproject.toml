[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalstats"
version = "0.0.1"
description = "Error bars, paired comparisons and power analysis for LLM evaluations."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Faraz Ali" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/evalstats"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
